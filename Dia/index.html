<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Revision Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiz Revision Platform</h1>
            <div class="controls">
                <button id="prev-btn">Previous</button>
                <span id="question-counter">Question 1 of 0</span>
                <button id="next-btn">Next</button>
            </div>
        </header>
        
        <main>
            <div id="quiz-container">
                <!-- Questions will be loaded here dynamically -->
                <div class="loading">Loading questions...</div>
            </div>
            
            <div class="bottom-controls">
                <button id="check-answers-btn">Check Answers</button>
                <button id="reset-btn">Reset Quiz</button>
            </div>
        </main>
        
        <footer>
            <p>Quiz Revision Platform © 2023</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
